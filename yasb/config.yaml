# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
#
# YASB v2.0.7 — Catppuccin Mocha, komorebi.
# Floating top bar. Full bar on the primary monitor, slim bar on the others.
# Widgets are grouped into grouper "pills"; see styles.css for the visual system.
# Popup/menu details replace label toggles so nothing on the bar changes width.

watch_stylesheet: true
watch_config: true
debug: false
update_check: true

komorebi:
  start_command: "komorebic start"
  stop_command: "komorebic stop"
  reload_command: "komorebic reload-configuration"

tooltip:
  offset: 8
  blur_effect:
    enabled: true
    dark_mode: true
    round_corners: true
    round_corners_type: "normal"
    border_color: "#313244"

bars:
  primary-bar:
    enabled: true
    screens: ["primary"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: true
      duration: 200
      type: "fade"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "#313244"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 40
    padding:
      top: 8
      left: 8
      bottom: 0
      right: 8
    widgets:
      left: ["launchpad", "wm", "active_window"]
      center: ["time"]
      right: ["media", "metrics", "controls", "status", "power_menu"]

  secondary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    animation:
      enabled: true
      duration: 200
      type: "fade"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "#313244"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 40
    padding:
      top: 8
      left: 8
      bottom: 0
      right: 8
    widgets:
      left: ["launchpad", "wm", "active_window"]
      center: ["time"]
      right: []

widgets:
  # ───────────────────────────── Groups (pills) ─────────────────────────────
  wm:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "wm-pill"
      widgets:
        [
          "komorebi_control",
          "komorebi_active_layout",
          "komorebi_stack",
          "komorebi_workspaces",
        ]
      collapse_options:
        enabled: false

  time:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "time-pill"
      widgets: ["clock_time", "clock_date"]
      collapse_options:
        enabled: false

  metrics:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "metrics-pill"
      widgets: ["memory", "cpu", "gpu", "disk", "ssd_health", "traffic"]
      collapse_options:
        enabled: false

  media:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "media-pill"
      widgets: ["media_lite", "audio_visualizer"]
      hide_empty: true
      collapse_options:
        enabled: false

  controls:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "controls-pill"
      widgets: ["systray", "wifi", "bluetooth", "volume", "control_center"]
      collapse_options:
        enabled: false

  status:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "status-pill"
      widgets: ["github", "notifications"]
      hide_empty: true
      collapse_options:
        enabled: false

  # ───────────────────────────── Left ─────────────────────────────
  launchpad:
    type: "yasb.launchpad.LaunchpadWidget"
    options:
      label: "<span>\U00002756</span>" # black diamond minus white x
      search_placeholder: "Search apps…"
      app_icon_size: 48
      window:
        fullscreen: false
        width: 1120
        height: 800
        overlay_block: true
      window_style:
        enable_blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
      window_animation:
        fade_in_duration: 120
        fade_out_duration: 100
      group_apps: false
      callbacks:
        on_left: "toggle_launchpad"

  komorebi_control:
    type: "komorebi.control.KomorebiControlWidget"
    options:
      label: "<span>\U000F0A1D</span>" # nf-md-view_dashboard_outline
      icons:
        start: "\uead3" # nf-cod-debug_start
        stop: "\uead7" # nf-cod-debug_stop
        reload: "\uead2" # nf-cod-debug_restart
      run_ahk: false
      run_whkd: false
      run_masir: false
      show_version: true
      komorebi_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "left"
        direction: "down"
        offset_top: 8
        offset_left: 0

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts:
        [
          "bsp",
          "columns",
          "rows",
          "grid",
          "scrolling",
          "vertical_stack",
          "horizontal_stack",
          "ultrawide_vertical_stack",
          "right_main_vertical_stack",
        ]
      layout_icons:
        bsp: "\uebeb" # nf-cod-layout
        columns: "\uebf7" # nf-cod-layout_centered
        rows: "\uec01" # nf-cod-layout_panel_off
        grid: "\U000F0758" # nf-md-grid_large
        scrolling: "\uebf7" # nf-cod-layout_centered
        vertical_stack: "\uebee" # nf-cod-layout_panel_left
        horizontal_stack: "\uebf0" # nf-cod-layout_panel_justify
        ultrawide_vertical_stack: "\uebee" # nf-cod-layout_panel_left
        right_main_vertical_stack: "\uebf1" # nf-cod-layout_panel_right
        monocle: "\uf06f" # nf-fa-maximize
        maximized: "\uf06f" # nf-fa-maximize
        floating: "\uf2d2" # nf-fa-window_restore
        paused: "\U000F03E6" # nf-md-pause_circle_outline
        tiling: "\U000F148E" # nf-md-view_quilt_outline
      callbacks:
        on_left: "toggle_layout_menu"
        on_middle: "next_layout"
        on_right: "prev_layout"
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "left"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_layout_icons: true

  komorebi_stack:
    type: "komorebi.stack.StackWidget"
    options:
      label_offline: ""
      label_window: "{process}"
      label_window_active: "{process}"
      label_no_window: ""
      label_zero_index: false
      show_icons: "always"
      icon_size: 14
      max_length: 12
      max_length_active: 16
      max_length_ellipsis: "…"
      hide_if_offline: true
      show_only_stack: true
      rewrite:
        - pattern: "^(.+?)\\.exe$"
          replacement: "\\1"
          case: "lower"
      enable_scroll_switching: true

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: ""
      label_workspace_btn: "{name}"
      label_workspace_active_btn: "{name}"
      label_workspace_populated_btn: "{name}"
      label_default_name: ""
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[app_name]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 64
      max_length_ellipsis: "…"
      monitor_exclusive: true
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  # ───────────────────────────── Center ─────────────────────────────
  clock_time:
    type: "yasb.clock.ClockWidget"
    options:
      class_name: "time"
      label: "{%H:%M}"
      label_alt: "{%H:%M}"
      tooltip: true
      update_interval: 1000
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "center"
        direction: "down"
        offset_top: 8
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  clock_date:
    type: "yasb.clock.ClockWidget"
    options:
      class_name: "date"
      label: "{%Y-%m-%d}"
      label_alt: "{%Y-%m-%d}"
      tooltip: false
      update_interval: 1000
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "center"
        direction: "down"
        offset_top: 8
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  # ───────────────────────────── Right: metrics (dimmed, fixed width) ─────────────────────────────
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\U000F035B</span>{virtual_mem_percent}%" # nf-md-memory
      label_alt: "<span>\U000F035B</span>{virtual_mem_percent}%" # nf-md-memory
      hide_decimal: true
      update_interval: 3000
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span>{info[percent][total]}%" # nf-oct-cpu
      label_alt: "<span>\uf4bc</span>{info[percent][total]}%" # nf-oct-cpu
      hide_decimal: true
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\U000F08AE</span>{info[utilization]}%" # nf-md-expansion_card
      label_alt: "<span>\U000F08AE</span>{info[utilization]}%" # nf-md-expansion_card
      gpu_index: 0
      hide_decimal: true
      units: "metric"
      update_interval: 2000
      gpu_thresholds:
        low: 25
        medium: 50
        high: 90
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\U000F02CA</span>{space[used][percent]}" # nf-md-harddisk
      label_alt: "<span>\U000F02CA</span>{space[used][percent]}" # nf-md-harddisk
      volume_label: "C"
      decimal_display: 0
      update_interval: 60
      disk_thresholds:
        low: 25
        medium: 50
        high: 90
      group_label:
        volume_labels: ["C", "G", "S"]
        show_label_name: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_group"
        on_middle: "do_nothing"
        on_right: "exec explorer C:\\"

  # Drive health/temp via LibreHardwareMonitor's web server (LHM must be running,
  # elevated). "Health" = 100 - NVMe Percentage Used / SATA remaining life.
  # Sensor IDs are per-machine: /nvme/2 = C:, /ssd/0 = G:, /hdd/1 = S:.
  # The menu is a flat name/value list, so each drive's heading row is rich text
  # (smaller, dimmer) showing total size, and its detail rows are space-indented.
  ssd_health:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      class_name: "ssd-health-widget"
      label: "<span>\U000F05F6</span>{info[value]}{info[unit]}" # nf-md-heart_pulse
      label_alt: "<span>\U000F05F6</span>{info[value]}{info[unit]}" # nf-md-heart_pulse
      sensor_id: "/nvme/2/level/20" # C: Samsung 990 PRO
      precision: 0
      update_interval: 60000
      history_size: 1
      connection_error_label: "<span>\U000F05F6</span>--" # nf-md-heart_pulse
      libre_menu:
        header_label: "Drives"
        precision: 0
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        sensors:
          - {
              id: "/nvme/2/data/32",
              name: "<span style='font-size:11px; color:#9399b2'>C:  Samsung 990 PRO</span>",
            }
          - { id: "/nvme/2/level/20", name: "    Health" }
          - { id: "/nvme/2/temperature/0", name: "    Temp" }
          - {
              id: "/ssd/0/data/32",
              name: "<span style='font-size:11px; color:#9399b2'>G:  Samsung 860 EVO</span>",
            }
          - { id: "/ssd/0/level/20", name: "    Health" }
          - { id: "/ssd/0/temperature/0", name: "    Temp" }
          - {
              id: "/hdd/1/data/32",
              name: "<span style='font-size:11px; color:#9399b2'>S:  WD Blue HDD</span>",
            }
          - { id: "/hdd/1/temperature/0", name: "    Temp" }
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>\U000F01DA</span>{download_speed}" # nf-md-download
      label_alt: "<span>\U000F01DA</span>{download_speed}" # nf-md-download
      speed_unit: "bytes"
      hide_decimal: true
      update_interval: 2000
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  # ───────────────────────────── Right: media ─────────────────────────────
  media_lite:
    type: "yasb.media_lite.MediaWidget"
    options:
      show_thumbnail: true
      show_title: true
      show_artist: false
      scrolling_label: false
      image_size: 20
      thumbnail_corner_radius: 4
      max_label_size: 28
      tooltip: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      media_menu:
        blur: true
        artwork_background: true
        artwork_blur_radius: 24
        artwork_dim: 0.6
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "center"
        direction: "down"
        offset_top: 8
        offset_left: 0
        image_size: 160
        thumbnail_corner_radius: 8

  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: bars
      height: 14
      smoothness: 80
      sensitivity: 50
      auto_gain: true
      framerate: 60
      freq_min: 60
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 10000
      channels: mono
      mono_option: average
      reverse: false
      mirror: false
      bars:
        count: 12
        width: 2
        gap: 3

  # ───────────────────────────── Right: controls ─────────────────────────────
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf078" # nf-fa-chevron_down
      label_expanded: "\uf077" # nf-fa-chevron_up
      label_position: "left"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: true
      show_unpinned_button: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "center"
        direction: "down"
        offset_top: 8
        offset_left: 0
      show_battery: false
      show_volume: false
      show_network: false
      use_hook: true

  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\U000F1542</span>" # nf-md-tune_variant
      tooltip: true
      sections_order:
        ["system_controls", "quick_actions", "sliders", "power", "media"]
      popup:
        alignment: "right"
        direction: "down"
        border_color: "#313244"
        round_corners: true
        round_corners_type: "normal"
        offset_top: 8
      sections:
        quick_actions:
          show: true
          columns: 3
        sliders:
          show: true
        media:
          show: false
        power:
          show: true
      callbacks:
        on_left: "toggle_menu"

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>"
      tooltip: true
      icons:
        bluetooth_on: "\U000F00AF" # nf-md-bluetooth
        bluetooth_off: "\U000F00B2" # nf-md-bluetooth_off
        bluetooth_connected: "\U000F00B1" # nf-md-bluetooth_connect
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>"
      tooltip: true
      icons:
        - "\U000F075F" # nf-md-volume_mute
        - "\U000F057F" # nf-md-volume_low
        - "\U000F0580" # nf-md-volume_medium
        - "\U000F0580" # nf-md-volume_medium
        - "\U000F057E" # nf-md-volume_high
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uf078" # nf-fa-chevron_down
          toggle_up: "\uf077" # nf-fa-chevron_up
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span>"
      update_interval: 5000
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span>"
      ethernet_icon: "\U000F0C9D" # nf-md-network_outline
      get_exact_wifi_strength: false
      wifi_icons:
        - "\U000F092E" # nf-md-wifi_strength_off_outline
        - "\U000F091F" # nf-md-wifi_strength_1
        - "\U000F0922" # nf-md-wifi_strength_2
        - "\U000F0925" # nf-md-wifi_strength_3
        - "\U000F0928" # nf-md-wifi_strength_4
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "do_nothing"
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0

  # ───────────────────────────── Right: status (hidden when nothing pending) ─────────────────────────────
  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span>\uf408</span>" # nf-oct-mark_github
      label_alt: "<span>\uf408</span>" # nf-oct-mark_github
      token: "" # empty = OAuth sign-in; token stored in %LOCALAPPDATA%\YASB\github_token
      max_notification: 30
      notification_dot:
        enabled: true
        corner: "top_right"
        color: "#fab387"
        margin: [1, 1]
      only_unread: true
      show_comment_count: false
      reason_filters: []
      max_field_size: 54
      update_interval: 300
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        show_categories: true
        categories_order:
          ["PullRequest", "Issue", "CheckSuite", "Release", "Discussion"]

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>\U000F009C</span>{count}" # nf-md-bell_outline
      label_alt: "<span>\U000F009C</span>{count}" # nf-md-bell_outline
      hide_empty: true
      tooltip: true
      callbacks:
        on_left: "toggle_notification"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  # ───────────────────────────── Right: PC control ─────────────────────────────
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\U000F0425</span>" # nf-md-power
      uptime: true
      show_user: true
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "#313244"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
      buttons:
        lock: ["\uea75", "Lock"] # nf-cod-lock
        signout: ["\U000F0343", "Sign out"] # nf-md-logout
        sleep: ["\u23fe", "Sleep"] # power sleep symbol
        restart: ["\uead2", "Restart"] # nf-cod-debug_restart
        shutdown: ["\U000F0425", "Shut Down"] # nf-md-power
