# wpm unit: keep Flow Launcher running across its own restarts and updates.
#
# wpm supervises watchdog.ps1; the watchdog supervises Flow
# Launcher by process name. Flow replaces its process on "Restart Flow
# Launcher", plugin installs and updates, which wpm's PID tracking can't
# follow. It is launched through the Squirrel stub so version upgrades
# (app-x.y.z directories) don't break the path.

[Unit]
Name = "flowlauncher"
Description = "Keeps Flow Launcher running across restarts and updates"

[Service]
Kind = "Simple"
Autostart = true
Restart = "Always"
RestartSec = 5

[Service.ExecStart]
Executable = "powershell.exe"
Arguments = [
    "-NoLogo",
    "-NoProfile",
    "-NonInteractive",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "$USERPROFILE/.config/wpm/watchdog.ps1",
    "-Name", "flowlauncher",
    "-ProcessName", "Flow.Launcher",
    "-Exe", "$USERPROFILE/AppData/Local/FlowLauncher/Flow.Launcher.exe",
    # Optional overrides (defaults shown):
    # "-IntervalSec", "5",
    # "-MissingGraceSec", "10",
]

[Service.Healthcheck.Process]
DelaySec = 1
